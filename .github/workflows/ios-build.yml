name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # 未签名的 .app：可以跑模拟器，装真机需要证书
      - name: Build (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned app
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr HRTRecorder-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HRTRecorder-unsigned-ipa
          path: build/ios/iphoneos/HRTRecorder-unsigned.ipa
          retention-days: 14
